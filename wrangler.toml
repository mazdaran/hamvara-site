name = "hamvara-growth-api"
main = "worker/src/index.js"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGINS = "https://hamvara.com,https://www.hamvara.com"
META_GRAPH_VERSION = "v23.0"
TARIFF_SYNC_ACTOR = "tariff-sync-service"
TARIFF_PREPARER_ACTOR = "tariff-preparer"
TARIFF_REVIEWER_ACTOR = "tariff-reviewer"
TARIFF_PUBLISHER_ACTOR = "tariff-publisher"

[ai]
binding = "AI"

[triggers]
crons = [ "0 6 * * *", "0 18 * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "hamvara-growth-production"
database_id = "bc036eef-2f9d-46cf-a468-cd9a0fb42a87"
migrations_dir = "worker/migrations"

# OAuth credentials and encryption keys are configured as runtime secrets.
