name = "hamvara-support"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://hamvara.com,https://www.hamvara.com"
CHAT_AI_ENABLED = "false"
CHAT_MODEL = ""
CHAT_DAILY_AI_LIMIT = "100"
