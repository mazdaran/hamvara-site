name: Create Encrypted Source Backup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type BACKUP-SOURCE to create the encrypted backup"
        required: true
      age_recipient:
        description: "Paste the public age1... recipient; never paste the private key"
        required: true

permissions:
  contents: read

concurrency:
  group: encrypted-source-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ inputs.confirmation == 'BACKUP-SOURCE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age
      - name: Create and verify encrypted source backup
        id: backup
        run: .github/scripts/create-encrypted-source-backup.sh
        env:
          BACKUP_AGE_RECIPIENT: ${{ inputs.age_recipient }}
          BACKUP_OUTPUT_DIRECTORY: ${{ runner.temp }}/hamvara-source-backup
      - name: Store encrypted backup for 90 days
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: |
            ${{ steps.backup.outputs.encrypted_path }}
            ${{ steps.backup.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Record artifact verification
        run: |
          {
            echo "- GitHub artifact ID: \`${{ steps.artifact.outputs.artifact-id }}\`"
            echo "- GitHub artifact SHA-256: \`${{ steps.artifact.outputs.artifact-digest }}\`"
            echo "- Retention: 90 days"
          } >> "$GITHUB_STEP_SUMMARY"
