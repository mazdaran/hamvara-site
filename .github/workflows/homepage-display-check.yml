name: Homepage Display Check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/homepage/**'
      - '.github/workflows/homepage-display-check.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/homepage/**'
      - '.github/workflows/homepage-display-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check UTF-8, HTML completeness, public assets and script syntax
        run: python tests/homepage/check_source.py --output artifacts/homepage/source-results.json
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/homepage/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check desktop, mobile, RTL, menus and content fallback
        run: python tests/homepage/smoke.py --output artifacts/homepage
      - name: Upload display-check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-display-check
          path: artifacts/homepage
          retention-days: 7
