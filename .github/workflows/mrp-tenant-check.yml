name: MRP Tenant Checks
on:
  pull_request:
    paths:
      - 'worker/**'
      - 'mrp/**'
      - '.github/workflows/mrp-tenant-check.yml'
permissions:
  contents: read
jobs:
  tenant-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker and tenant isolation
        working-directory: worker
        run: npm run check
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/tenant-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/tenant-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check company management UI against SQLite handler
        run: NODE_PATH="$RUNNER_TEMP/tenant-browser/node_modules" node worker/scripts/check-workspace-ui.cjs
