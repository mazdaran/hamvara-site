name: Verify Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/*.yml"
  workflow_dispatch:
    inputs:
      storage_stress:
        description: "Run the 50k and 100k MRP artifact storage stress gate"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Verify without changing production
        run: npm run check
      - name: Enforce MRP performance budgets
        run: npm run check:performance
      - name: Enforce large MRP artifact storage budgets
        if: github.event_name == 'workflow_dispatch' && inputs.storage_stress
        run: npm run check:storage-stress
