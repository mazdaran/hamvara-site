name: Deploy Worker Manually

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-PRODUCTION to deploy the verified Worker"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY-PRODUCTION' }}
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify deploy configuration and tests
        run: npm run check
      - name: Deploy Worker without database migration
        run: npm run deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
