name: Deployment safety checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'wrangler.toml'
      - 'worker/wrangler.preview.json'
      - 'worker/src/isolated-preview.js'
      - 'worker/test/deployment-fixes.test.mjs'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test worker/test/deployment-fixes.test.mjs
