name: Migrate Production D1 Manually

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MIGRATE-PRODUCTION to apply reviewed migrations"
        required: true

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE-PRODUCTION' }}
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify configuration and tests before migration
        run: npm run check
      - name: Apply reviewed D1 migrations only
        run: npm run migrate:production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
