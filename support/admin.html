<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://hamvara-support.yahya-mazdarani.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Hamvara Team Inbox</title><link rel="stylesheet" href="style.css"><script src="config.js" defer></script><script src="copy.js" defer></script><script src="admin.js" type="module"></script></head><body><header><a href="/">Hamvara</a><h1 data-copy="inbox">Team inbox</h1><select id="language" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option><option value="tr">Türkçe</option></select></header><main class="shell admin-shell"><p id="error" role="alert" hidden></p><form id="login"><h2 data-copy="login">Operator sign in</h2><label for="key" data-copy="key">Operator access key</label><input id="key" type="password" required minlength="32" maxlength="200" autocomplete="off"><button data-copy="signin">Sign in</button><p class="small" data-copy="operatorNote"></p></form><section id="desk" hidden><div class="actions"><strong id="operator"></strong><label><input id="available" type="checkbox"><span data-copy="available"></span></label><button id="refresh" data-copy="refresh">Refresh</button><button id="notify" data-copy="notice">Notifications</button><button id="logout" data-copy="signout">Sign out</button></div><div class="inbox-grid"><aside><h2 data-copy="inbox">Team inbox</h2><div id="threads"></div></aside><section><p id="status" role="status" data-copy="choose">Select a conversation.</p><div id="thread" hidden><div id="messages" role="log" aria-live="polite" aria-label="Conversation"></div><div class="actions"><button id="claim" data-copy="claim">Take conversation</button><button id="release" data-copy="release">Return to queue</button><button id="close" data-copy="close">Close conversation</button></div><form id="reply"><label for="text" data-copy="placeholder">Write your reply</label><textarea id="text" required maxlength="1800"></textarea><button data-copy="send">Send</button></form></div></section></div></section><noscript>JavaScript is required for the operator inbox.</noscript></main></body></html>
